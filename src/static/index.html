<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Article NER Service</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #f7f9fb;
      color: #1a202c;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 860px;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 32px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }
    h1 {
      font-size: 22px;
      margin-bottom: 6px;
      color: #0f172a;
    }
    p.subtitle {
      font-size: 14px;
      color: #64748b;
      margin-bottom: 24px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #334155;
      margin-bottom: 6px;
    }
    input[type="text"], textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 14px;
      background: #ffffff;
      color: #0f172a;
    }
    input[type="text"]:focus, textarea:focus {
      outline: none;
      border-color: #2563eb;
      box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.15);
    }
    textarea {
      resize: vertical;
      min-height: 120px;
    }
    button {
      background-color: #2563eb;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    button:disabled {
      background-color: #94a3b8;
      cursor: not-allowed;
    }
    .status-alert {
      display: none;
      margin-top: 20px;
      padding: 12px 16px;
      border-radius: 6px;
      font-size: 14px;
    }
    .status-error {
      background-color: #fef2f2;
      border: 1px solid #fecaca;
      color: #991b1b;
    }
    .results-container {
      margin-top: 32px;
      display: none;
    }
    .results-meta {
      font-size: 13px;
      color: #64748b;
      margin-bottom: 12px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }
    th, td {
      border: 1px solid #e2e8f0;
      padding: 10px 12px;
      text-align: left;
    }
    th {
      background-color: #f8fafc;
      font-weight: 600;
      color: #475569;
    }
    .tag {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 600;
      background-color: #e0e7ff;
      color: #3730a3;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Article Named-Entity Recognition</h1>
    <p class="subtitle">Extract recognized entities, labels, and spans from combined article titles and bodies.</p>

    <div class="form-group">
      <label for="titleInput">Article Title</label>
      <input type="text" id="titleInput" placeholder="e.g. Maybank posts record profit in Kuala Lumpur">
    </div>

    <div class="form-group">
      <label for="bodyInput">Article Body</label>
      <textarea id="bodyInput" placeholder="Enter full article text here..."></textarea>
    </div>

    <button id="submitBtn" onclick="handleExtract()">Extract Entities</button>

    <div id="statusAlert" class="status-alert"></div>

    <div id="resultsContainer" class="results-container">
      <div id="resultsMeta" class="results-meta"></div>
      <table>
        <thead>
          <tr>
            <th>Entity Text</th>
            <th>Type</th>
            <th>Start Offset</th>
            <th>End Offset</th>
          </tr>
        </thead>
        <tbody id="entitiesTableBody"></tbody>
      </table>
    </div>
  </div>

  <script>
    async function handleExtract() {
      const title = document.getElementById("titleInput").value.trim();
      const body = document.getElementById("bodyInput").value.trim();
      const btn = document.getElementById("submitBtn");
      const alertBox = document.getElementById("statusAlert");
      const resultsContainer = document.getElementById("resultsContainer");
      const tableBody = document.getElementById("entitiesTableBody");
      const metaBox = document.getElementById("resultsMeta");

      alertBox.style.display = "none";
      alertBox.className = "status-alert";
      tableBody.innerHTML = "";
      resultsContainer.style.display = "none";

      if (!title || !body) {
        alertBox.textContent = "Error 400: Both Title and Body are required.";
        alertBox.className = "status-alert status-error";
        alertBox.style.display = "block";
        return;
      }

      btn.disabled = true;
      btn.textContent = "Processing...";

      try {
        const response = await fetch("/extract-entities", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ title, body })
        });

        const data = await response.json();

        if (!response.ok) {
          const detailMsg = data.detail || "Failed to process article text.";
          alertBox.textContent = `Error ${response.status}: ${detailMsg}`;
          alertBox.className = "status-alert status-error";
          alertBox.style.display = "block";
          return;
        }

        metaBox.textContent = `Found ${data.meta.entity_count} entities using model: ${data.meta.model}`;
        
        if (data.entities.length === 0) {
          const row = document.createElement("tr");
          row.innerHTML = `<td colspan="4" style="text-align: center; color: #64748b;">No named entities found in the text.</td>`;
          tableBody.appendChild(row);
        } else {
          data.entities.forEach(ent => {
            const row = document.createElement("tr");
            row.innerHTML = `
              <td><strong>${escapeHtml(ent.text)}</strong></td>
              <td><span class="tag">${escapeHtml(ent.label)}</span></td>
              <td>${ent.start}</td>
              <td>${ent.end}</td>
            `;
            tableBody.appendChild(row);
          });
        }

        resultsContainer.style.display = "block";
      } catch (err) {
        alertBox.textContent = `Client network error: ${err.message}`;
        alertBox.className = "status-alert status-error";
        alertBox.style.display = "block";
      } finally {
        btn.disabled = false;
        btn.textContent = "Extract Entities";
      }
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }
  </script>
</body>
</html>
